name: Preview Deployment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for preview
        run: npm run build
        env:
          # Testnet configuration - never use production secrets
          NEXT_PUBLIC_STELLAR_NETWORK: testnet
          NEXT_PUBLIC_STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_STELLAR_PASSPHRASE: "Test SDF Network ; September 2015"
          # Do NOT set PINATA_JWT or other production secrets here

      - name: Create deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          preview: true

      - name: Add preview comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const deploymentUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `## 🔍 Preview Deployment

            A preview of this PR has been built with **testnet** configuration.

            ⚠️ **This is not production** — no production secrets are used.

            [View Preview Build](${deploymentUrl})

            **Configuration:**
            - Network: Testnet
            - Secrets: None (testnet only)

            > **Note:** If this PR requires a wallet (Freighter), please test locally as preview deployments may not have full wallet integration.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
