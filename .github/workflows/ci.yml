name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue builds each entry on a gh-readonly-queue/* branch and fires
  # merge_group, not pull_request. Without this trigger the four required checks
  # never report there, so every queued PR stalls in AWAITING_CHECKS until the
  # ruleset's 30-minute timeout evicts it and nothing can ever merge.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  test:
    # Node 20 is the required check and keeps the plain `test` name the
    # ruleset and the `status` job expect; 22 and 24 are informational.
    name: ${{ matrix.node == 20 && 'test' || format('test (node {0}, informational)', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.node != 20 }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  # Issue #240: coverage is measured per file with the V8 provider and a
  # ratchet threshold (see vitest.config.mts). The provider is pinned to the
  # vitest version and installed with --no-save so `npm ci` stays
  # lockfile-clean. The summary is published to the job output so the
  # per-file report is the main deliverable without opening the artifact.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install V8 coverage provider (pinned to vitest version)
        run: npm install --no-save @vitest/coverage-v8@5.0.5
      - name: Run coverage (enforces thresholds in vitest.config.mts)
        run: npm run coverage
      - name: Publish coverage summary to job output
        if: always()
        run: |
          echo "## Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json'); const t=s.total; console.log('Lines: '+t.lines.pct+'% ('+t.lines.covered+'/'+t.lines.total+') | Functions: '+t.functions.pct+'% | Branches: '+t.branches.pct+'% | Statements: '+t.statements.pct+'%')" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Per-file coverage (coverage/coverage-summary.json)</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "coverage/coverage-summary.json not found" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    # Node 20 is the required check and keeps the plain `build` name the
    # ruleset and the `status` job expect; 22 and 24 are informational.
    name: ${{ matrix.node == 20 && 'build' || format('build (node {0}, informational)', matrix.node) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.node != 20 }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build

  # Screenshot baselines for the main routes in both themes × two viewports
  # (#270). An unreviewed visual change fails this job and, through `status`,
  # the PR — updating a baseline is a deliberate, reviewed act. Failed runs
  # upload the actual/expected/diff PNGs as the `visual-diffs` artifact.
  # Policy and baseline-update instructions: docs/visual-tests.md
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload diffs and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  # End-to-end smoke tests (Playwright) against mocked RPC and backend (#374)
  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  # Separate from lint/typecheck/test/build on purpose: a new advisory landing
  # in the tree affects every open PR at once, regardless of what that PR
  # changes. Keeping it out of `status`'s needs and off continue-on-error
  # means a fresh finding shows up as a visible (yellow-triangle) warning here
  # without turning unrelated PRs red or blocking their merge.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (moderate+, known ipfs-http-client findings allowlisted)
        continue-on-error: true
        run: npm run audit

  # Separate from lint for the same reason as `audit`: a package going unused
  # (or a new one landing without being wired up) isn't something the PR that
  # triggers it necessarily touched, so it's kept off `status`'s needs rather
  # than folded into an existing required job.
  depcheck:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run depcheck

  # Knip detects unused *code* (exports, types, files, dependencies) — depcheck
  # above only detects unused *packages*. Diffed against the committed baseline
  # so pre-existing findings stay tracked as follow-ups (see
  # docs/unused-exports.md) while any NEW finding fails the build. Kept out of
  # `status`'s needs like depcheck/audit: an unused export landing in one file
  # isn't something every open PR should turn red for.
  knip:
    name: Unused exports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run knip:check
      - name: Fail on a stale baseline
        run: npm run knip:baseline -- --check

  # Deliberately commented out: this is a design note for #143, not a disabled
  # job. It becomes a real job once the interface artifact can be regenerated
  # in CI.
  #
  # TODO #143: Contract ABI drift detection is missing. Once the interface
  # artifact from P2-012a exists, nothing in CI verifies it against the
  # contract. All jobs (lint, typecheck, test, build) pass against a stale
  # ABI because none can see the contract. Failure surfaces only at user
  # signature time, not in CI.
  #
  # IMPROVEMENT STRATEGY:
  # 1. Add a CI job that:
  #    a) Checks out a pinned ourdao-contracts ref (e.g., via submodule or explicit clone)
  #    b) Regenerates the interface artifact with the Stellar CLI
  #    c) Diffs against the committed artifact in this repo
  #    d) Fails on mismatch with a message naming the regeneration command
  #
  # 2. Example job skeleton:
  #    contract-abi-check:
  #      name: Contract ABI drift detection
  #      runs-on: ubuntu-latest
  #      steps:
  #        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #          with:
  #            persist-credentials: false
  #        - name: Install Stellar CLI
  #          run: ...  # Install soroban-cli at the pinned version
  #        - name: Regenerate interface from pinned contract
  #          run: |
  #            cd ourdao-contracts/  # or clone it
  #            soroban contract build
  #            soroban contract bindings typescript ...
  #        - name: Compare against committed artifact
  #          run: |
  #            diff -u src/lib/contract-interface.ts generated/contract-interface.ts \
  #              && echo "Contract ABI matches" \
  #              || (echo "ERROR: Contract ABI has drifted. Run: npm run regenerate-contract-interface" && exit 1)
  #
  # 3. Run on both pull requests and a schedule (e.g., daily) so contract-side
  #    drift surfaces without waiting for a frontend PR.
  #
  # 4. Consider making the scheduled run non-blocking and open an issue instead
  #    so a contract outage doesn't block unrelated frontend work.
  #
  # Note: This depends on ourdao-contracts repo, so it fails for network/ref
  # reasons unrelated to the PR. Keep it scoped so such failures don't cascade.

  # Compares the client JS/CSS actually shipped (.next/static) against the
  # latest baseline captured from main, so a PR's effect on bundle size is
  # visible instead of invisible until someone notices the app got slower.
  bundle-size:
    name: Bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      # ANALYZE_BUNDLE=1 turns on productionBrowserSourceMaps (next.config.ts) so
      # the composition report can attribute shipped bytes to packages (#266).
      - run: npm run build
        env:
          ANALYZE_BUNDLE: "1"
      - run: node scripts/bundle-size.mjs measure
      - name: Restore baseline from main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-size-baseline.json
          key: bundle-size-baseline-unused
          restore-keys: |
            bundle-size-baseline-
      - name: Restore composition baseline from main
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-composition-baseline.json
          key: bundle-composition-baseline-unused
          restore-keys: |
            bundle-composition-baseline-
      - name: Compare against baseline and write summary
        run: node scripts/bundle-size.mjs report
      - name: Save baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp bundle-size-current.json bundle-size-baseline.json
          cp bundle-composition-current.json bundle-composition-baseline.json
      - name: Cache baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-size-baseline.json
          key: bundle-size-baseline-${{ github.sha }}
      - name: Cache composition baseline for main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-composition-baseline.json
          key: bundle-composition-baseline-${{ github.sha }}
      # Uploaded on every run so a reviewer can diff composition without
      # rebuilding locally -- the point of #266 is attributing a regression
      # without a local reproduction.
      - name: Upload composition report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-composition
          path: bundle-composition-current.json
          if-no-files-found: ignore

  # Runs on every PR (same cadence as bundle-size, not scheduled) because
  # this is a small app where a regression is easy to introduce in any given
  # PR and cheap to catch immediately — waiting for a nightly/scheduled run
  # would let a Core Web Vitals regression sit on main for up to a day
  # before anyone noticed. See lighthouserc.js for the budgets and an
  # explicit note that they're placeholders pending the first real run.
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.js', 'src/**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build
      - name: Run Lighthouse CI against the production build
        run: npm run lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  # Records each job's outcome as an artifact so the privileged ci-status-comment.yml
  # workflow (triggered via workflow_run, never a fork's copy of it) can post a PR
  # comment. This job itself never runs with elevated permissions or fork code.
  status:
    name: Record status
    if: always()
    needs: [lint, typecheck, test, coverage, build, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write status artifact
        run: |
          cat <<EOF > ci-status.json
          {
            "pr_number": ${{ toJSON(github.event.pull_request.number) }},
            "run_id": "${{ github.run_id }}",
            "results": {
              "lint": "${{ needs.lint.result }}",
              "typecheck": "${{ needs.typecheck.result }}",
              "test": "${{ needs.test.result }}",
              "coverage": "${{ needs.coverage.result }}",
              "build": "${{ needs.build.result }}",
              "visual": "${{ needs.visual.result }}"
            }
          }
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-status
          path: ci-status.json
          retention-days: 1
