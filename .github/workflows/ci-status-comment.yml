name: CI status comment

# Runs in the base repo's context using the workflow file from `main`.
# Security trust model:
# Identity (PR number, run ID, and run URL) is derived strictly from trusted
# GitHub workflow context and GitHub API calls (workflow_run.id, workflow_run.head_sha,
# and repos.listPullRequestsAssociatedWithCommit), NEVER from untrusted artifacts that
# could be crafted or manipulated by fork PRs. Job outcomes are queried directly
# from the Actions API (actions.listJobsForWorkflowRun) and validated strictly
# against the allowed set: success, failure, cancelled, skipped.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const runId = run.id;
            const headSha = run.head_sha;

            // Resolve PR number safely via GitHub API from the workflow run's head commit SHA
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });

            const pr = prs.find((p) => p.state === 'open') || prs[0];
            if (!pr) {
              console.log('No pull request found for head_sha:', headSha);
              return;
            }
            const prNumber = pr.number;

            // Query trusted job statuses directly via Actions API
            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const jobs = [
              ['Lint', 'lint', 'npm run lint'],
              ['Typecheck', 'typecheck', 'npm run typecheck'],
              ['Test', 'test', 'npm test'],
              ['Build', 'build', 'npm run build'],
              ['Visual', 'visual', 'npm run test:visual'],
            ];

            const allowedResults = new Set(['success', 'failure', 'cancelled', 'skipped']);

            const results = {};
            for (const [, key] of jobs) {
              const matchedJob = jobsData.jobs.find((j) =>
                j.name.toLowerCase().includes(key)
              );
              const conclusion = matchedJob ? matchedJob.conclusion : null;
              results[key] = allowedResults.has(conclusion) ? conclusion : 'failure';
            }

            const icon = (r) =>
              r === 'success' ? '✅' :
              r === 'skipped' ? '⏭️' :
              r === 'cancelled' ? '⏹️' : '❌';

            const failed = jobs.filter(([, key]) =>
              !['success', 'skipped'].includes(results[key]));

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const marker = '<!-- ci-status-comment -->';
            let body = `${marker}\n### CI status\n\n`;
            body += jobs.map(([label, key]) => `- ${icon(results[key])} **${label}**`).join('\n');
            body += `\n\n[Full run details](${runUrl})`;

            if (failed.length > 0) {
              body += `\n\nThis PR can't be merged until the failing check(s) above are fixed. Reproduce locally:\n`;
              body += failed.map(([, key, cmd]) => `- \`${cmd}\``).join('\n');
            } else {
              body += `\n\nAll required checks passed.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
